[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv312", ".venv", "citeguard-frontend/node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error::DeprecationWarning",
    "error::RuntimeWarning",
    # Starlette 1.6.0 imports this deprecated AnyIO alias; application code does not.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
